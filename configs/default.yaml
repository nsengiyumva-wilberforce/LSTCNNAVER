# Lightweight Spatio-Temporal CNN for Audio-Visual Emotion Recognition
# Ding, Tang, Lu — IEEE TAFFC 2025, 16(4):2721-2734
# DOI: 10.1109/TAFFC.2025.3566773

seed: 42

model:
  num_classes: 8
  visual_channels: [16, 32, 64]
  visual_kernel: 3
  audio_channels: [16, 32]
  audio_kernel: 5
  dropout: 0.4                      # RAVDESS 0.4; SAVEE 0.5; MEAD 0.3 (set from dataset)
  fusion_hidden: 16                 # 16 RAVDESS/MEAD, 14 SAVEE (set from dataset)

data:
  dataset: ravdess                  # ravdess | savee | mead | synthetic
  root: /media/computergeek/SER-datasets/Ravdess
  image_size: 64                    # paper: grayscale 64x64
  grayscale: true
  num_frames: 6                     # six one-sixth windows; each is one training sample
  num_audio_segments: 6
  n_mfcc: 40
  sample_rate: null                 # paper: native source rate (RAVDESS 48 kHz)
  n_fft: 2048
  hop_length: 512
  detect_face: true
  face_margin: 0.0                  # Haar box only (paper training)
  align_face: false                 # paper trains Haar crops; dlib-68 is supp occlusion/IG only
  speech_only: true
  trim_silence: true                # RAVDESS ~1s head/tail holds; all six windows are speech
  trim_top_db: 30
  time_stretch: 0.8                 # RAVDESS: train-only, full trimmed clip, then six windows
  face_noise_var: 0.01              # RAVDESS: Keras GaussianNoise stddev (train only, resampled)
  cache_dir: data/cache             # delete this folder after preprocessing changes

train:
  epochs: 1000
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  adam_eps: 1.0e-7
  optimizer: adam
  num_workers: 8
  prefetch_factor: 2
  val_ratio: 0.2
  test_ratio: 0.2
  split: stratified                 # paper: 8640 windows; clip = utterance holdout
  patience: 30                      # Δval_loss < 0.001 for 30 epochs → restore
  min_delta: 0.001
  out_dir: outputs

explain:
  ig_steps: 50
  baseline: zero
