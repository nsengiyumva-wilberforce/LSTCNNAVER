# Lightweight Spatio-Temporal CNN for Audio-Visual Emotion Recognition
# Ding, Tang, Lu — IEEE TAFFC 2025, 16(4):2721-2734
# DOI: 10.1109/TAFFC.2025.3566773

seed: 42

model:
  num_classes: 8
  # Spatial 2D CNN: 16 → 32 → 64 (paper)
  visual_channels: [16, 32, 64]
  visual_kernel: 3
  visual_pool: flatten              # 8x8x64 after 3 pools; needed for ~0.06M params
  # Audio 1D CNN: 16 → 32 (paper)
  audio_channels: [16, 32]
  audio_kernel: 3
  dropout: 0.3
  fusion_hidden: 0                  # 0 = concat → linear (hits 0.06M)
  stack_frames_as_channels: true    # 6 grayscale frames as 6-channel input (0.014 GFLOPs)

data:
  dataset: ravdess                  # ravdess | savee | mead | synthetic
  root: data/raw
  image_size: 64                    # paper: grayscale 64x64
  grayscale: true
  num_frames: 6                     # paper: 6 video frames
  num_audio_segments: 6             # paper: 6 audio segments, time-aligned with frames
  n_mfcc: 40                        # paper
  sample_rate: 16000
  n_fft: 2048
  hop_length: 512
  mfcc_frames_per_segment: 32
  detect_face: true
  speech_only: true

train:
  epochs: 50
  batch_size: 16
  lr: 0.001
  weight_decay: 0.0001
  optimizer: adam
  num_workers: 4
  val_ratio: 0.15
  test_ratio: 0.15
  split: speaker                    # speaker | random
  patience: 10
  out_dir: outputs

explain:
  ig_steps: 50
  baseline: zero

qat:
  epochs: 5
  batch_size: 16
  lr: 0.0001
