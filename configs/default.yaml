# Lightweight Spatio-Temporal CNN for Audio-Visual Emotion Recognition
# Ding, Tang, Lu — IEEE TAFFC 2025, 16(4):2721-2734
# DOI: 10.1109/TAFFC.2025.3566773

seed: 42

model:
  num_classes: 8
  visual_channels: [16, 32, 64]
  visual_kernel: 3
  audio_channels: [16, 32]
  audio_kernel: 5
  dropout: 0.4                      # RAVDESS 0.4; SAVEE 0.5; MEAD 0.3 (set from dataset)
  fusion_hidden: 16                 # 16 RAVDESS/MEAD, 14 SAVEE (set from dataset)

data:
  dataset: ravdess                  # ravdess | savee | mead | synthetic
  root: data/raw
  image_size: 64
  grayscale: true
  num_frames: 6                     # six one-sixth windows; each is one training sample
  num_audio_segments: 6
  n_mfcc: 40
  sample_rate: null                 # paper: native source rate (RAVDESS 48 kHz)
  n_fft: 2048
  hop_length: 512
  detect_face: true
  speech_only: true
  time_stretch: 0.8                 # RAVDESS train aug
  cache_dir: data/cache             # skip video decode after the first run

train:
  epochs: 200
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  adam_eps: 1.0e-7
  optimizer: adam
  num_workers: 8
  prefetch_factor: 2
  val_ratio: 0.2
  test_ratio: 0.2
  split: stratified
  patience: 30                      # Δval_loss < 0.001 for 30 epochs → restore
  min_delta: 0.001
  out_dir: outputs

explain:
  ig_steps: 50
  baseline: zero

qat:
  epochs: 5
  batch_size: 128
  lr: 0.0001
